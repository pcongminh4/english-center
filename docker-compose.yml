services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    env_file:
      - ./Backend/.env
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 512M 

  backend_blue:
    # Thay pcongminh4 bằng username Docker Hub của bạn
    image: pcongminh551/english-center-backend:latest
    restart: always
    depends_on:
      - db
    env_file: [./Backend/.env]
    environment:
      - DATABASE_URL=mysql://root:123456@db:3306/english_center
      - PORT=5000
    volumes:
      - ./Backend/uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 400M

  backend_green:
    image: pcongminh551/english-center-backend:latest
    restart: always
    depends_on:
      - db
    env_file: [./Backend/.env]
    environment:
      - DATABASE_URL=mysql://root:123456@db:3306/english_center
      - PORT=5000
    volumes:
      - ./Backend/uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 400M

  frontend:
    # Thay pcongminh551 bằng username Docker Hub của bạn
    image: pcongminh551/english-center-frontend:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Backend/uploads:/usr/share/nginx/html/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    deploy:
      resources:
        limits:
          memory: 100M